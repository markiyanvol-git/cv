      { title: t("Freelance writing","Фриланс-тексты","Teksty freelance"), meta: t("9 Jun 2015 · Copywriting, rewriting, research writing","9 июня 2015 · копирайтинг, рерайтинг, research writing","9 czerwca 2015 · copywriting, rewriting, research writing"), detail: t("Also listed topics: RAID storage, cloud computing, remote storage, backup.","Также указаны темы: RAID, облачные вычисления, удалённое хранение, резервное копирование.","Dodatkowo tematy: RAID, chmura, zdalne przechowywanie, backup.") },
      { title: t("Kantian Deontological Ethics","Kantian Deontological Ethics","Kantian Deontological Ethics"), meta: t("Research paper in philosophy","Исследовательская работа по философии","Praca badawcza z filozofii"), detail: t("Quantum Computer Essays","Quantum Computer Essays","Quantum Computer Essays") },
      { title: t("The political, administrative and economic impacts of European colonization of Africa","Политические, административные и экономические последствия европейской колонизации Африки","Polityczne, administracyjne i gospodarcze skutki europejskiej kolonizacji Afryki"), meta: t("Research paper on colonies in Africa in the 18th century","Исследовательская работа о колониях в Африке в XVIII веке","Praca badawcza o koloniach w Afryce w XVIII wieku"), detail: t("Quantum Computer Essays","Quantum Computer Essays","Quantum Computer Essays") },
    ];
    const courses = t(["English private lessons","Math private lessons"],["Частные уроки английского","Частные уроки математики"],["Prywatne lekcje angielskiego","Prywatne lekcje matematyki"]);

    let lang = localStorage.getItem("mv-cv-lang") || "ru";
    if (!["en","ru","pl"].includes(lang)) lang = "ru";

    function render() {
      document.documentElement.lang = lang;
      document.getElementById("langs").innerHTML = ["en","ru","pl"].map((id) =>
        `<button type="button" aria-pressed="${lang===id}" data-lang="${id}">${id.toUpperCase()}</button>`
      ).join("");
      document.getElementById("copyBtn").textContent = ui.copy[lang];
      document.getElementById("aside").innerHTML = `
        <div class="mono">MV</div>
        <section>
          <h2 class="side-title">${ui.contact[lang]}</h2>
          <p style="margin:0 0 .75rem;font-size:.875rem;line-height:1.5">${location[lang]}</p>
          <p style="margin:0 0 .75rem;font-size:.875rem"><a href="${LINKEDIN}">${ui.linkedin[lang]}</a></p>
          <div class="share"><code>${PUBLIC_URL.replace("https://","")}</code></div>
        </section>
        <section>
          <h2 class="side-title">${ui.languages[lang]}</h2>
          ${languages.map((x) => `<div class="lang-row">${x[lang]}</div>`).join("")}
        </section>
        <section>
          <h2 class="side-title">${ui.skills[lang]}</h2>
          <div class="chips">${skills[lang].map((s) => `<span class="chip">${s}</span>`).join("")}</div>
        </section>
        <section>
          <h2 class="side-title">${ui.certificates[lang]}</h2>
          <p style="margin:0;font-size:.875rem;font-weight:500">${certificate.name[lang]}</p>
          <p style="margin:.35rem 0 0;font-size:.75rem;color:var(--sidebar-muted)">${certificate.issued[lang]}</p>
        </section>
        <section>
          <h2 class="side-title">${ui.courses[lang]}</h2>
          ${courses[lang].map((c) => `<div class="lang-row">${c}</div>`).join("")}
        </section>`;
      document.getElementById("main").innerHTML = `
        <header style="border-bottom:1px solid var(--hairline);padding-bottom:1.5rem">
          <p class="kicker">Curriculum Vitae</p>
          <h1 class="name">Marek Volkov</h1>
          <p class="headline">${headline[lang]}</p>
          <p class="loc">${location[lang]}</p>
        </header>
        <section class="block">
          <h2 class="sec">${ui.profile[lang]}</h2>
          <p style="margin:0;max-width:42rem;line-height:1.65">${summary[lang]}</p>
        </section>
        <section class="block">
          <h2 class="sec">${ui.experience[lang]}</h2>
          ${jobs.map((j) => `
            <div class="job">
              <div class="job-top"><h3>${j.role[lang]}</h3><p class="job-dates">${j.dates[lang]}</p></div>
              <p class="job-co">${j.company[lang]}</p>
              ${j.location[lang] !== "—" ? `<p class="job-loc">${j.location[lang]}</p>` : ""}
              <ul>${j.bullets[lang].map((b) => `<li>${b}</li>`).join("")}</ul>
            </div>`).join("")}
        </section>
        <section class="block">
          <h2 class="sec">${ui.education[lang]}</h2>
          <h3 style="margin:0;font-size:1.125rem">${education.degree[lang]}</h3>
          <p class="job-co">${education.school[lang]}</p>
          <p class="job-loc">${education.dates[lang]}</p>
        </section>
        <section class="block">
          <h2 class="sec">${ui.publications[lang]}</h2>
          ${publications.map((p) => `
            <div class="job">
              <h3>${p.title[lang]}</h3>
              <p class="job-co">${p.meta[lang]}</p>
              <p class="job-loc">${p.detail[lang]}</p>
            </div>`).join("")}
        </section>
        <p class="source">${ui.source[lang]}</p>`;
    }
    document.getElementById("langs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-lang]");
      if (!btn) return;
      lang = btn.dataset.lang;
      localStorage.setItem("mv-cv-lang", lang);
      render();
    });
    document.getElementById("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(PUBLIC_URL);
        document.getElementById("copyBtn").textContent = ui.copied[lang];
        setTimeout(() => { document.getElementById("copyBtn").textContent = ui.copy[lang]; }, 1500);
      } catch {
        prompt("URL", PUBLIC_URL);
      }
    });
    render();
  </script>
</body>
</html>
